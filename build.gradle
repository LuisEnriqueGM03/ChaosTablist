plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

loom {
	mods {
		"chaostablist" {
			sourceSet sourceSets.main
		}
	}

	runs {
		// Autoprueba visual: ./gradlew runSelftest (necesita run/saves/selftest; capturas en run/screenshots).
		selftest {
			client()
			name "Self Test"
			programArgs "--quickPlaySingleplayer", "selftest"
			vmArg "-Dchaostablist.selftest=true"
		}
		// Capturas y GIF de demostración: ./gradlew runShowcase y luego python tools/make_showcase.py (deja screenshots/).
		showcase {
			client()
			name "Showcase"
			programArgs "--quickPlaySingleplayer", "selftest", "--width", "1280", "--height", "720"
			vmArg "-Dchaostablist.showcase=true"
		}
		// Cliente que entra directo al servidor local como "Luis": ./gradlew runJoinServer
		joinServer {
			client()
			name "Join Server"
			programArgs "--username", "Luis", "--quickPlayMultiplayer", "localhost:25565"
		}
		// Igual, pero el servidor trata al cliente como vanilla: ./gradlew runSelftestVanilla
		selftestVanilla {
			client()
			name "Self Test (vanilla)"
			programArgs "--quickPlaySingleplayer", "selftest"
			vmArg "-Dchaostablist.selftest=true"
			vmArg "-Dchaostablist.forceVanilla=true"
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = "UTF-8"
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}
