plugins { id 'net.fabricmc.fabric-loom-remap' version "${loom_version}" }
apply from: rootProject.file('gradle/loader.gradle')
dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
}
loom {
    runs {
        selftest {
            client(); runDir 'run'; vmArg '-Dchaostablist.selftest=true'
        }
        selftestVanilla {
            client(); runDir 'run'; vmArg '-Dchaostablist.selftest=true'; vmArg '-Dchaostablist.forceVanilla=true'
        }
        showcase {
            client(); runDir 'run'; vmArg '-Dchaostablist.showcase=true'
            programArgs '--quickPlaySingleplayer', 'selftest', '--width', '1280', '--height', '720'
        }
        serverSmoke { server(); runDir 'run-server-smoke'; programArgs '--initSettings' }
    }
}
