plugins { id 'net.neoforged.moddev.legacyforge' version "${moddev_version}" }
apply from: rootProject.file('gradle/loader.gradle')
legacyForge {
 enable { neoForgeVersion = "${minecraft_version}-${neoforge_version}"; disableRecompilation = true }
 runs {
  client { client(); gameDirectory = file('run') }
  serverSmoke { server(); gameDirectory = file('run-server-smoke'); programArgument '--initSettings' }
  server { server(); gameDirectory = file('run') }
  selftest { client(); gameDirectory = file('run'); systemProperty 'chaostablist.selftest', 'true' }
  selftestVanilla { client(); gameDirectory = file('run'); systemProperty 'chaostablist.selftest', 'true'; systemProperty 'chaostablist.forceVanilla', 'true' }
  selftestSmall { client(); gameDirectory = file('run'); systemProperty 'chaostablist.selftest', 'true'; systemProperty 'chaostablist.selftest.small', 'true'; programArguments.addAll('--width','1024','--height','768') }
 }
 mods { chaostablist { sourceSet sourceSets.main } }
}
dependencies { annotationProcessor 'org.spongepowered:mixin:0.8.5:processor' }
mixin { add sourceSets.main, 'chaostablist.refmap.json'; config 'chaostablist.mixins.json' }
jar { manifest { attributes('MixinConfigs': 'chaostablist.mixins.json') } }
