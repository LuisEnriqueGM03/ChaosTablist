plugins { id 'net.neoforged.moddev' version '2.0.148' }
apply from: rootProject.file('gradle/loader.gradle')
neoForge {
    version = neoforge_version
    runs {
        client { client(); gameDirectory = file('run') }
        server { server(); gameDirectory = file('run'); programArgument '--nogui' }
        serverSmoke { server(); gameDirectory = file('run-server-smoke'); programArgument '--initSettings' }
        selftest {
            client(); gameDirectory = file('run')
            systemProperty 'chaostablist.selftest', 'true'
            programArguments.addAll('--quickPlaySingleplayer', 'selftest')
        }
        showcase {
            client(); gameDirectory = file('run')
            systemProperty 'chaostablist.showcase', 'true'
            programArguments.addAll('--quickPlaySingleplayer', 'selftest', '--width', '1280', '--height', '720')
        }
        selftestVanilla {
            client(); gameDirectory = file('run')
            systemProperty 'chaostablist.selftest', 'true'
            systemProperty 'chaostablist.forceVanilla', 'true'
            programArguments.addAll('--quickPlaySingleplayer', 'selftest')
        }
    }
    mods { chaostablist { sourceSet sourceSets.main } }
}
