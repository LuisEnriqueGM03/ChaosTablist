plugins { id 'net.minecraftforge.gradle' version '7.0.34' }
apply from: rootProject.file('gradle/loader.gradle')
minecraft {
    runs {
        configureEach {
            workingDir = layout.projectDirectory.dir('run')
            args '--mixin.config', 'chaostablist.mixins.json'
        }
        register('client') {
            if (project.hasProperty('selftest')) systemProperty 'chaostablist.selftest', 'true'
            if (project.hasProperty('selftestVanilla')) {
                systemProperty 'chaostablist.selftest', 'true'
                systemProperty 'chaostablist.forceVanilla', 'true'
            }
            if (project.hasProperty('selftestSmall')) {
                systemProperty 'chaostablist.selftest', 'true'
                args '--width', '1024', '--height', '768'
            }
        }
        register('server') {
            args '--nogui'
            if (project.hasProperty('serverSmoke')) {
                workingDir = layout.projectDirectory.dir('run-server-smoke')
                args '--initSettings'
            }
        }
    }
}
repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}
dependencies { implementation minecraft.dependency("net.minecraftforge:forge:${minecraft_version}-${forge_version}") }
jar { manifest { attributes('MixinConfigs': 'chaostablist.mixins.json') } }
// Forge's bundled Mixin 0.8.7 accepts JAVA_21; Java 25 still compiles and runs all classes.
processResources {
    filesMatching('chaostablist.mixins.json') { filter { line -> line.replace('JAVA_25', 'JAVA_21') } }
}
