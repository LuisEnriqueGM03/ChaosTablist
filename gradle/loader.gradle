apply plugin: 'java-library'
base.archivesName = "chaostablist-${project.name}-${minecraft_version}"
java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}
repositories { mavenCentral() }
sourceSets.main {
    java.srcDir '../common/src/main/java'
    resources.srcDir '../common/src/main/resources'
}
sourceSets.test.java.srcDir '../common/src/test/java'
sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.runtimeClasspath
dependencies { compileOnly 'org.jetbrains:annotations:24.1.0' }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 25 }
processResources {
    def props = [version: project.version, minecraft_version: minecraft_version]
    inputs.properties(props)
    filesMatching(['fabric.mod.json', 'META-INF/mods.toml', 'META-INF/neoforge.mods.toml']) { expand props }
}
jar { from(rootProject.file('LICENSE')) }
tasks.register('regressionTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.chaos.tablist.RegressionSuite'
    systemProperty 'chaostablist.loader', project.name
    workingDir = layout.buildDirectory.get().asFile
}
tasks.named('check') { dependsOn tasks.named('regressionTest') }
tasks.named('test') {
    if (org.gradle.util.GradleVersion.current() >= org.gradle.util.GradleVersion.version('9.0')) failOnNoDiscoveredTests = false
}
tasks.withType(JavaExec).configureEach {
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
}
